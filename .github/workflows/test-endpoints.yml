name: Test nextstrain.org endpoints

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  curl:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-slim
          - ubuntu-24.04
          - ubuntu-22.04
          - ubuntu-26.04
          - ubuntu-24.04-arm
          - ubuntu-22.04-arm
          - ubuntu-26.04-arm
          - macos-15-intel
          - macos-26-intel
          - macos-14
          - macos-15
          - macos-26
          - xcode-27
          - windows-2022
          - windows-2025
          - windows-11-arm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: GET www. /
        run: curl --verbose --head https://www.nextstrain.org/
      - name: GET /
        run: curl --verbose --head https://nextstrain.org/
      - name: GET /cli/…
        run: curl --verbose --head https://nextstrain.org/cli/download/latest/standalone-x86_64-unknown-linux-gnu.tar.gz
      - if: always()
        run: echo "$(date -u +%FT%TZ) $(curl -s https://api.ipify.org)"
